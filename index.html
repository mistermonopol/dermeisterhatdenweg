<!doctype html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>DER MEISTER HAT DEN WEG</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@400;600&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --red: #cc1500;
                --red-dim: #6a0a00;
                --red-glow: rgba(200, 20, 0, 0.75);
                --red-faint: rgba(160, 15, 0, 0.35);
            }

            *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

            body {
                background: #000;
                overflow: hidden;
                font-family: "Cinzel", serif;
                color: var(--red);
                -webkit-tap-highlight-color: transparent;
            }

            #canvas-wrap {
                position: fixed; inset: 0;
                width: 100%; height: 100%;
                height: 100dvh;
            }

            /* ── Vignette + UI ─────────────────────────────────── */
            #ui { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
            #ui::after {
                content: ""; position: absolute; inset: 0;
                background: radial-gradient(ellipse at center, transparent 28%, rgba(0,0,0,0.93) 100%);
                pointer-events: none;
            }

            /* ── Ornate frame ──────────────────────────────────── */
            #frame { position: fixed; inset: 0; z-index: 6; pointer-events: none; }
            #frame::before {
                content: ""; position: absolute; inset: 8px;
                border: 1px solid var(--red-faint);
                box-shadow: 0 0 22px rgba(200,18,0,0.22), inset 0 0 22px rgba(200,18,0,0.1);
            }
            #frame::after {
                content: ""; position: absolute; inset: 15px;
                border: 1px solid rgba(100,8,0,0.28);
            }
            .corner {
                position: absolute;
                width: 42px; height: 42px;
                filter: drop-shadow(0 0 4px rgba(200,20,0,0.7));
            }
            .corner svg { width: 100%; height: 100%; }
            .corner.tl { top: 8px;    left: 8px; }
            .corner.tr { top: 8px;    right: 8px; }
            .corner.bl { bottom: 8px; left: 8px; }
            .corner.br { bottom: 8px; right: 8px; }

            /* ── Intro / Disclaimer ────────────────────────────── */
            #intro {
                position: absolute; inset: 0;
                display: flex; flex-direction: column;
                align-items: center; justify-content: center;
                padding: 5vw;
                pointer-events: all; cursor: pointer;
                transition: opacity 1.8s ease;
            }
            #intro .disclaimer {
                font-size: clamp(0.55rem, 2.5vw, 0.62rem);
                letter-spacing: 0.45em; color: var(--red-dim);
                margin-bottom: 1.4rem;
                animation: breathe 3s ease-in-out infinite;
            }
            #intro h1 {
                font-family: "Bebas Neue", sans-serif;
                font-size: clamp(1.6rem, 7vw, 4rem);
                letter-spacing: 0.25em; text-align: center; line-height: 1.35;
                color: var(--red);
                text-shadow: 0 0 30px var(--red-glow), 0 0 60px rgba(200,20,0,0.35);
                animation: breathe 2.8s ease-in-out infinite;
            }
            #intro .body {
                margin-top: 1.2rem;
                font-size: clamp(0.72rem, 2.8vw, 0.95rem);
                letter-spacing: 0.18em; text-align: center; line-height: 2;
                color: #7a1500;
            }
            #intro .cta {
                margin-top: 2.5rem;
                font-size: clamp(0.75rem, 2.5vw, 0.95rem);
                letter-spacing: 0.45em; color: var(--red-dim);
                animation: breathe 2.8s ease-in-out infinite 1.4s;
            }
            @keyframes breathe { 0%,100%{ opacity:.45 } 50%{ opacity:1 } }

            /* ── Lyric overlay ─────────────────────────────────── */
            #lyric {
                position: absolute; bottom: 17%; left: 50%; transform: translateX(-50%);
                width: 88%;
                font-family: "Cinzel", serif;
                font-size: clamp(0.75rem, 3vw, 1.15rem);
                letter-spacing: 0.2em; text-align: center;
                color: var(--red);
                text-shadow: 0 0 24px var(--red-glow);
                opacity: 0; transition: opacity 0.9s ease;
            }

            /* ── Door choice screen (2D overlay) ───────────────── */
            #door-screen {
                position: absolute; inset: 0;
                display: flex; flex-direction: column;
                align-items: center; justify-content: center;
                padding: 3vh 0 8vh 0; gap: 1.5vh;
                background: rgba(0,0,0,0.92);
                opacity: 0; transition: opacity 0.5s ease;
                pointer-events: none;
            }
            #door-screen.on { opacity: 1; pointer-events: all; }
            #door-main {
                display: flex; align-items: center;
                width: 100%; flex: 1; min-height: 0;
                gap: 2vw; padding: 0 2vw;
            }
            .door-side {
                flex: 1;
                font-family: "Cinzel", serif; font-weight: 600;
                font-size: clamp(1rem, 2.5vw, 1.6rem);
                letter-spacing: 0.06em; line-height: 1.7;
                color: var(--red); text-align: center;
                text-shadow: 0 0 12px var(--red-glow);
                white-space: pre-line;
            }
            #door-side-l {
                color: #d4a830;
                text-shadow: 0 0 14px rgba(220,170,50,0.8), 0 0 40px rgba(200,150,30,0.4);
            }
            .door-item {
                flex: 0 0 27%; display: flex; flex-direction: column;
                align-items: center; gap: 0.8rem;
                cursor: pointer; min-width: 0;
                -webkit-tap-highlight-color: transparent;
            }
            .door-item:active { opacity: 0.8; }
            .door-item-label {
                font-size: clamp(1.5rem, 6.5vw, 3.5rem);
                text-align: center; flex-shrink: 0;
            }
            #door-lbl-l {
                font-family: "Cinzel", serif; font-weight: 600;
                letter-spacing: 0.12em; color: #d4a830;
                text-shadow: 0 0 18px rgba(220,170,50,0.95), 0 0 40px rgba(200,150,30,0.55);
            }
            #door-lbl-r {
                font-family: "Bebas Neue", sans-serif;
                letter-spacing: 0.06em; color: #cc0000;
                text-shadow: 0 0 16px rgba(220,0,0,0.95), 0 0 36px rgba(180,0,0,0.6);
            }
            .door-item-desc {
                display: none; /* shown only on mobile */
                font-family: "Cinzel", serif; font-weight: 600;
                font-size: clamp(0.85rem, 3.5vw, 1.1rem);
                letter-spacing: 0.05em; line-height: 1.6;
                color: var(--red); text-align: center;
                text-shadow: 0 0 10px var(--red-glow);
                white-space: pre-line; flex-shrink: 0;
            }
            .door-item img {
                width: 100%; flex: 1; min-height: 0;
                object-fit: contain; display: block;
            }
            #door-screen-lyric {
                font-family: "Cinzel", serif;
                font-size: clamp(1rem, 2.8vw, 1.5rem);
                letter-spacing: 0.25em; text-align: center;
                color: var(--red); flex-shrink: 0;
                text-shadow: 0 0 24px var(--red-glow);
            }

            /* ── Sigil pips ────────────────────────────────────── */
            #pips {
                position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
                display: flex; gap: 18px; opacity: 0; transition: opacity 0.6s; z-index: 20;
            }
            .pip {
                width: 9px; height: 9px; border-radius: 50%;
                border: 1px solid #2a0400;
            }
            .pip.lit {
                background: var(--red); border-color: var(--red);
                box-shadow: 0 0 10px var(--red-glow);
            }

            /* ── Reveal screen ─────────────────────────────────── */
            #reveal {
                position: absolute; inset: 0;
                display: flex; flex-direction: column;
                align-items: center; justify-content: center;
                padding: 6vh 6vw;
                overflow-y: auto; -webkit-overflow-scrolling: touch;
                opacity: 0; transition: opacity 2.8s ease;
                gap: 0;
            }
            #reveal.on { opacity: 1; pointer-events: all; }
            #reveal .cover-wrap {
                width: clamp(160px, 48vw, 240px);
                aspect-ratio: 1; flex-shrink: 0;
                margin-bottom: 1.4rem;
                border: 1px solid var(--red-dim);
                box-shadow: 0 0 30px rgba(200,18,0,0.35), inset 0 0 10px rgba(0,0,0,0.6);
                overflow: hidden;
            }
            #reveal .cover-wrap img {
                width: 100%; height: 100%; object-fit: cover; display: block;
                filter: brightness(0.88) saturate(1.1);
            }
            #reveal h1 {
                font-family: "Bebas Neue", sans-serif;
                font-size: clamp(2rem, 9vw, 3.5rem);
                letter-spacing: 0.32em; line-height: 1.3; text-align: center;
                color: var(--red);
                text-shadow: 0 0 40px var(--red-glow), 0 0 80px rgba(200,20,0,0.3);
            }
            #reveal .sub {
                margin-top: 0.6rem;
                font-size: clamp(0.55rem, 1.8vw, 0.65rem);
                letter-spacing: 0.25em; color: var(--red-dim); text-align: center;
            }
            #reveal .pct-line {
                margin-top: 1.2rem;
                font-family: "Bebas Neue", sans-serif;
                font-size: clamp(1.5rem, 7vw, 2.2rem);
                letter-spacing: 0.25em; text-align: center;
            }
            #reveal .pct-line.gut {
                color: #d4a830;
                text-shadow: 0 0 20px rgba(220,170,50,0.8), 0 0 50px rgba(200,150,30,0.4);
            }
            #reveal .pct-line.boese {
                color: var(--red);
                text-shadow: 0 0 20px var(--red-glow), 0 0 50px rgba(180,0,0,0.35);
            }
            #reveal .path {
                display: flex; flex-wrap: wrap; align-items: center;
                justify-content: center; gap: 8px;
                margin-top: 1.6rem;
                font-size: clamp(0.5rem, 1.8vw, 0.6rem);
                letter-spacing: 0.18em; font-family: "Cinzel", serif;
            }
            .path-node {
                padding: 4px 14px;
                border: 1px solid var(--red-dim); color: var(--red);
                box-shadow: 0 0 8px rgba(200,18,0,0.2);
            }
            .path-sep { color: #3a0500; }
            #reveal button {
                margin-top: 2rem;
                width: min(360px, 92%);
                padding: 14px 20px;
                border: 1px solid var(--red); background: transparent;
                color: var(--red); font-family: "Cinzel", serif;
                font-size: clamp(0.6rem, 2vw, 0.65rem);
                letter-spacing: 0.35em; cursor: pointer;
                transition: background 0.35s, color 0.35s, box-shadow 0.35s;
                box-shadow: 0 0 12px rgba(200,18,0,0.2);
                min-height: 48px;
            }
            #reveal button:active,
            #reveal button:hover {
                background: var(--red); color: #000;
                box-shadow: 0 0 30px var(--red-glow);
            }
            #promo-btn {
                margin-top: 1rem;
                width: min(360px, 92%);
                padding: 16px 20px;
                border: 1px solid var(--red); background: var(--red);
                color: #000; font-family: "Bebas Neue", sans-serif;
                font-size: clamp(1rem, 3.5vw, 1.4rem);
                letter-spacing: 0.3em; text-align: center; text-decoration: none;
                box-shadow: 0 0 30px var(--red-glow);
                transition: background 0.35s, color 0.35s;
                min-height: 52px;
                display: flex; align-items: center; justify-content: center;
            }
            #promo-btn:hover, #promo-btn:active {
                background: transparent; color: var(--red);
            }

            /* ── Desktop enhancements ──────────────────────────── */
            @media (min-width: 768px) {
                .corner { width: 62px; height: 62px; }
                #frame::before { inset: 13px; }
                #frame::after  { inset: 21px; }
                .corner.tl { top: 13px; left: 13px; }
                .corner.tr { top: 13px; right: 13px; }
                .corner.bl { bottom: 13px; left: 13px; }
                .corner.br { bottom: 13px; right: 13px; }

                #reveal { justify-content: center; padding: 0 6vw; }
                #reveal .cover-wrap { margin-bottom: 2rem; }
                #reveal .path { margin-top: 3rem; }
                #reveal button { margin-top: 3rem; }
            }

            /* ── Mobile: desc above doors, hide side panels ───── */
            @media (max-width: 600px) {
                .door-side { display: none; }
                .door-item { flex: 1; }
                .door-item-desc { display: block; }
                .door-item-label { font-size: clamp(1.6rem, 8vw, 3rem); }
                #door-desc-l { color: #d4a830; text-shadow: 0 0 14px rgba(220,170,50,0.8); }
                #door-screen-lyric { font-size: clamp(1.2rem, 5vw, 1.8rem); }
                #intro h1 { font-size: clamp(2.4rem, 12vw, 4rem); }
                #intro .body { font-size: clamp(0.95rem, 4.5vw, 1.3rem); }
                #intro .disclaimer { font-size: clamp(0.7rem, 3vw, 0.9rem); }
                #intro .cta { font-size: clamp(0.7rem, 3vw, 0.9rem); }
            }

            /* ── Legal bar + modal ─────────────────────────────── */
            #legal-bar {
                position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
                display: flex; gap: 12px; align-items: center;
                z-index: 40; pointer-events: all;
            }
            #legal-bar button {
                background: none; border: none; cursor: pointer;
                font-family: "Cinzel", serif;
                font-size: clamp(0.9rem, 2.2vw, 1.3rem);
                letter-spacing: 0.25em; color: var(--red-dim);
                transition: color 0.3s; padding: 4px 8px;
            }
            #legal-bar button:hover { color: var(--red); }
            #legal-bar span { color: var(--red-dim); font-size: 0.9rem; }
            #legal-modal {
                position: fixed; inset: 0; z-index: 50;
                background: rgba(0,0,0,0.98);
                display: flex; flex-direction: column;
                align-items: center; justify-content: flex-start;
                padding: 6vh 6vw; overflow-y: auto;
                -webkit-overflow-scrolling: touch;
            }
            #legal-modal.hidden { display: none; }
            #legal-modal-inner {
                max-width: 640px; width: 100%;
                font-family: "Cinzel", serif; color: #c03a28;
                font-size: clamp(0.65rem, 2vw, 0.78rem);
                letter-spacing: 0.08em; line-height: 2;
            }
            #legal-modal-inner h2 {
                font-family: "Bebas Neue", sans-serif;
                font-size: clamp(1.4rem, 5vw, 2.2rem);
                letter-spacing: 0.3em; color: var(--red);
                text-shadow: 0 0 20px var(--red-glow); margin-bottom: 1.5rem;
            }
            #legal-modal-inner h3 {
                margin-top: 1.2rem; margin-bottom: 0.4rem;
                font-size: clamp(0.7rem, 2vw, 0.85rem);
                letter-spacing: 0.2em; color: var(--red);
            }
            #legal-modal-inner p { margin-bottom: 0.8rem; }
            #legal-modal-inner a { color: #c03a28; }
            #legal-close {
                margin-top: 2rem; background: none;
                border: 1px solid var(--red-dim); color: var(--red-dim);
                font-family: "Cinzel", serif;
                font-size: clamp(0.55rem, 1.8vw, 0.65rem);
                letter-spacing: 0.3em; cursor: pointer; padding: 10px 24px;
                transition: border-color 0.3s, color 0.3s;
            }
            #legal-close:hover { border-color: var(--red); color: var(--red); }

            /* ── Landscape phone — keep reveal compact ─────────── */
            @media (max-height: 500px) {
                #reveal { flex-direction: row; flex-wrap: wrap; padding: 4vh 4vw; gap: 0 3vw; }
                #reveal .cover-wrap { width: clamp(80px, 18vw, 130px); margin-bottom: 0; align-self: center; }
                #reveal .pct-line { margin-top: 0.5rem; font-size: clamp(0.9rem, 4vw, 1.6rem); }
                #reveal h1 { font-size: clamp(1rem, 4vw, 2rem); }
                #reveal .sub { font-size: 0.5rem; }
            }
        </style>
    </head>
    <body>
        <div id="canvas-wrap"></div>

        <!-- Ornate frame overlay -->
        <div id="frame" aria-hidden="true">
            <!-- Top-left -->
            <svg
                class="corner tl"
                width="62"
                height="62"
                viewBox="0 0 62 62"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
            >
                <polyline
                    points="0,61 0,0 61,0"
                    stroke="#bb1400"
                    stroke-width="1.5"
                />
                <polyline
                    points="7,54 7,7 54,7"
                    stroke="#bb1400"
                    stroke-width="0.7"
                    opacity="0.38"
                />
                <line
                    x1="24"
                    y1="0"
                    x2="24"
                    y2="7"
                    stroke="#bb1400"
                    stroke-width="0.9"
                />
                <line
                    x1="0"
                    y1="24"
                    x2="7"
                    y2="24"
                    stroke="#bb1400"
                    stroke-width="0.9"
                />
                <rect
                    x="1"

                    height="5"
                    stroke="#bb1400"
                    stroke-width="0.7"
                    opacity="0.5"
                />
            </svg>
            <!-- Top-right -->
            <svg
                class="corner tr"
                width="62"
                height="62"
                viewBox="0 0 62 62"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
            >
                <polyline
                    points="62,61 62,0 1,0"
                    stroke="#bb1400"
                    stroke-width="1.5"
                />
                <polyline
                    points="55,54 55,7 8,7"
                    stroke="#bb1400"

                    opacity="0.38"
                />
                <line
                    x1="38"
                    y1="0"
                    x2="38"
                    y2="7"
                    stroke="#bb1400"
                    stroke-width="0.9"
                />
                <line
                    x1="55"
                    y1="24"
                    x2="62"
                    y2="24"
                    stroke="#bb1400"
                    stroke-width="0.9"
                />
                <rect
                    x="56"

                    width="5"

            </svg>
            <!-- Bottom-left -->
            <svg
                class="corner bl"
                width="62"
                height="62"
                viewBox="0 0 62 62"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
            >
                <polyline
                    points="0,1 0,62 61,62"
                    stroke="#bb1400"
                    stroke-width="1.5"
                />
                <polyline
                    points="7,8 7,55 54,55"
                    stroke="#bb1400"
                    stroke-width="0.7"
                    opacity="0.38"
                />
                <line
                    x1="24"
                    y1="55"
                    x2="24"
                    y2="62"
                    stroke="#bb1400"
                    stroke-width="0.9"
                />
                <line
                    x1="0"
                    y1="38"
                    x2="7"
                    y2="38"
                    stroke="#bb1400"
                    stroke-width="0.9"
                />
                <rect
                    x="1"
                    y="56"
                    width="5"
                    height="5"
                    stroke="#bb1400"
                    stroke-width="0.7"
                    opacity="0.5"
                />
            </svg>
            <!-- Bottom-right -->
            <svg
                class="corner br"
                width="62"
                height="62"
                viewBox="0 0 62 62"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
            >
                <polyline
                    points="62,1 62,62 1,62"
                    stroke="#bb1400"
                    stroke-width="1.5"
                />
                <polyline
                    points="55,8 55,55 8,55"
                    stroke="#bb1400"
                    stroke-width="0.7"
                    opacity="0.38"
                />
                <line
                    x1="38"
                    y1="55"
                    x2="38"
                    y2="62"
                    stroke="#bb1400"
                    stroke-width="0.9"
                />
                <line
                    x1="55"
                    y1="38"
                    x2="62"
                    y2="38"
                    stroke="#bb1400"
                    stroke-width="0.9"
                />
                <rect
                    x="56"
                    y="56"
                    width="5"
                    height="5"
                    stroke="#bb1400"
                    stroke-width="0.7"
                    opacity="0.5"
                />
            </svg>
        </div>

        <div id="ui">
            <div id="intro">
                <p class="disclaimer">— MISTER MONOPOL —</p>
                <h1>BIST DU BEREIT<br />DEINEN WEG ZU WÄHLEN?</h1>
                <p class="body">Hör zu.<br />Tritt durch die Türen.</p>
                <p class="cta">[ KLICKE UM EINZUTRETEN ]</p>
            </div>

            <div id="lyric"></div>

            <div id="door-screen">
                <div id="door-main">
                    <div class="door-side" id="door-side-l"></div>
                    <div class="door-item" id="door-left">
                        <div class="door-item-label" id="door-lbl-l"></div>
                        <div class="door-item-desc" id="door-desc-l"></div>
                        <img src="curved_good.png" alt="" />
                    </div>
                    <div class="door-item" id="door-right">
                        <div class="door-item-label" id="door-lbl-r"></div>
                        <div class="door-item-desc" id="door-desc-r"></div>
                        <img src="curved_evil.png" alt="" />
                    </div>
                    <div class="door-side" id="door-side-r"></div>
                </div>
                <div id="door-screen-lyric"></div>
            </div>

            <div id="pips">
                <div class="pip" id="p0"></div>
                <div class="pip" id="p1"></div>
                <div class="pip" id="p2"></div>
            </div>

            <div id="reveal">
                <div class="cover-wrap">
                    <img
                        src="cover.jpg"
                        alt="Der Meister Hat Den Weg — Mister Monopol"
                    />
                </div>
                <h1>DER MEISTER<br />HAT DEN WEG</h1>
                <div class="sub">dein weg war der einzig mögliche</div>
                <div class="pct-line" id="pct-line"></div>
                <div class="path" id="path"></div>
                <button onclick="share()">TEILE DEINEN WEG</button>
                <a href="https://music.monopol-ai.de/weg" target="_blank" id="promo-btn">FINDE DEINEN WEG</a>
            </div>
        </div>

        <!-- Legal bar -->
        <div id="legal-bar">
            <button onclick="openLegal('impressum')">IMPRESSUM</button>
            <span>|</span>
            <button onclick="openLegal('datenschutz')">DATENSCHUTZ</button>
        </div>

        <!-- Legal modal -->
        <div id="legal-modal" class="hidden">
            <div id="legal-modal-inner"></div>
            <button id="legal-close" onclick="closeLegal()">SCHLIESSEN</button>
        </div>

        <script>
            const LEGAL_TEXTS = {
                impressum: `
                    <h2>IMPRESSUM</h2>
                    <h3>ANGABEN GEMÄß § 5 TMG</h3>
                    <p>Max Felle<br>Daimlerstraße 115<br>70372 Stuttgart (Bad Cannstatt)<br>Deutschland</p>
                    <h3>KONTAKT</h3>

                `,
                datenschutz: `
                    <h2>DATENSCHUTZ&shy;ERKLÄRUNG</h2>

            };
            function openLegal(key) {
                document.getElementById('legal-modal-inner').innerHTML = LEGAL_TEXTS[key];
                document.getElementById('legal-modal').classList.remove('hidden');
            }
            function closeLegal() {

        <script type="module">
            import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js";

            // ── Audio ─────────────────────────────────────────────────────────────────────

            const audio = new Audio("mp3_meistermaster.mp3");
            audio.loop = true;
            audio.volume = 0;

            function fadeInAudio() {
                audio.currentTime = 33;
                audio.play().catch(() => {});
                const step = () => {
                    if (audio.volume < 0.05) {
                        audio.volume = Math.min(audio.volume + 0.003, 0.05);
                        setTimeout(step, 120);
                    }
                };
                step();
            }

            // ── Scene config ──────────────────────────────────────────────────────────────

            const CW = 5,
                CH = 3.5,
                SEG = 22;

            const STEPS = [
                {
                    lyric: "DU HAST GEWARTET",
                    left:  { name: "GEDULD",  hex: 0x660000, desc: "Geduld ist Tugend\nwider Hast und Zorn." },
                    right: { name: "DRANG",   hex: 0xaa2200, desc: "Dunkles Treiben ohne Maß." },
                },
                {
                    lyric: "ALLES FÜGT SICH",
                    left:  { name: "ORDNUNG", hex: 0x440000, desc: "Harmonie, Maß\nund fester Halt." },
                    right: { name: "CHAOS",   hex: 0x880d00, desc: "Aus dem Sturm wächst\ndie neue Form." },
                },
                {
                    lyric: "ES IST NICHT ZU SPÄT",
                    left:  { name: "LICHT",   hex: 0xcc3300, desc: "Himmelsglanz, Klarheit\nund heiliger Schein." },
                    right: { name: "DUNKEL",  hex: 0x220000, desc: "Im Dunkel wartet,\nwas du nicht siehst." },
                },
            ];

            const DOOR_Z = [1, 2, 3].map((i) => -(SEG * i * 0.55));

            // ── Runtime state ─────────────────────────────────────────────────────────────

            let phase = "intro";
            let step = 0;
            let camZ = 0,
                targetZ = 0;
            let picked = [];
            let sides = [];
            let candleLights = [];

            // ── Three.js bootstrap ────────────────────────────────────────────────────────

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
            renderer.setSize(innerWidth, innerHeight);
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            document
                .getElementById("canvas-wrap")
                .appendChild(renderer.domElement);

            const scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x020000, 0.054);

            const camera = new THREE.PerspectiveCamera(
                68,
                innerWidth / innerHeight,
                0.1,
                90,
            );
            camera.position.set(0, 1.65, 0);

            scene.add(new THREE.AmbientLight(0x1a0000, 0.55));

            // ── Sigil canvas texture ──────────────────────────────────────────────────────

            function makeSigilTexture(hex) {
                const sz = 256;
                const cv = document.createElement("canvas");
                cv.width = cv.height = sz;
                const g = cv.getContext("2d");
                g.fillStyle = "#060100";
                g.fillRect(0, 0, sz, sz);

                const col = "#" + hex.toString(16).padStart(6, "0");
                g.strokeStyle = col;
                g.fillStyle = col;
                g.lineWidth = 1;
                g.globalAlpha = 0.55;

                const cx = sz / 2,
                    cy = sz / 2,
                    r = 100;

                g.beginPath();
                g.arc(cx, cy, r, 0, Math.PI * 2);
                g.stroke();
                g.beginPath();
                g.arc(cx, cy, 32, 0, Math.PI * 2);
                g.stroke();

                for (let a = 0; a < 6; a++) {
                    const angle = (a / 6) * Math.PI * 2;
                    g.beginPath();
                    g.moveTo(
                        cx + Math.cos(angle) * 32,
                        cy + Math.sin(angle) * 32,
                    );
                    g.lineTo(
                        cx + Math.cos(angle) * r,
                        cy + Math.sin(angle) * r,
                    );
                    g.stroke();
                    g.beginPath();
                    g.arc(
                        cx + Math.cos(angle) * r,
                        cy + Math.sin(angle) * r,
                        4,
                        0,
                        Math.PI * 2,
                    );
                    g.fill();
                }

                g.globalAlpha = 0.22;
                [
                    [30, 128, 226, 128],
                    [128, 30, 128, 226],
                    [53, 53, 203, 203],
                    [203, 53, 53, 203],
                ].forEach(([x1, y1, x2, y2]) => {
                    g.beginPath();
                    g.moveTo(x1, y1);
                    g.lineTo(x2, y2);
                    g.stroke();
                });

                const t = new THREE.CanvasTexture(cv);
                t.wrapS = t.wrapT = THREE.RepeatWrapping;
                t.repeat.set(2.8, 2.8);
                return t;
            }

            // ── Corridor ──────────────────────────────────────────────────────────────────

            function addCorridor(zFrom, zTo) {
                const len = Math.abs(zTo - zFrom);
                const midZ = (zFrom + zTo) / 2;
                const darkMat = new THREE.MeshLambertMaterial({
                    color: 0x0c0202,
                });
                const floorMat = new THREE.MeshLambertMaterial({
                    color: 0x0e0404,
                    map: makeSigilTexture(0x6a0000),
                });

                const plane = (w, h, mat, x, y, z, rx, ry) => {
                    const m = new THREE.Mesh(
                        new THREE.PlaneGeometry(w, h),
                        mat,
                    );
                    m.rotation.set(rx, ry, 0);
                    m.position.set(x, y, z);
                    scene.add(m);
                };

                plane(CW, len, floorMat, 0, 0, midZ, -Math.PI / 2, 0);
                plane(CW, len, darkMat, 0, CH, midZ, Math.PI / 2, 0);
                plane(len, CH, darkMat, -CW / 2, CH / 2, midZ, 0, Math.PI / 2);
                plane(len, CH, darkMat, CW / 2, CH / 2, midZ, 0, -Math.PI / 2);

                [0.3, 0.7].forEach((t) => {
                    const cz = zFrom + (zTo - zFrom) * t;
                    [-CW / 2 + 0.28, CW / 2 - 0.28].forEach((cx) => {
                        const fl = new THREE.PointLight(0xff1800, 1.0, 8);
                        fl.position.set(cx, 0.35, cz);
                        scene.add(fl);
                        candleLights.push(fl);

                        const candle = new THREE.Mesh(
                            new THREE.CylinderGeometry(0.03, 0.03, 0.28, 6),
                            new THREE.MeshLambertMaterial({ color: 0xd0b070 }),
                        );
                        candle.position.set(cx, 0.14, cz);
                        scene.add(candle);
                    });
                });
            }

            for (let i = 0; i < 4; i++) addCorridor(-i * SEG, -(i + 1) * SEG);

            // ── UI helpers ────────────────────────────────────────────────────────────────

            const lyricEl = document.getElementById("lyric");
            const doorScreen = document.getElementById("door-screen");

            function showLyric(text, fadeAfter = 0) {
                lyricEl.textContent = text;
                lyricEl.style.opacity = 1;
                if (fadeAfter > 0)
                    setTimeout(() => (lyricEl.style.opacity = 0), fadeAfter);
            }

            function showDoorScreen() {
                const s = STEPS[step];
                document.getElementById("door-lbl-l").textContent = s.left.name;
                document.getElementById("door-lbl-r").textContent = s.right.name;
                document.getElementById("door-side-l").textContent = s.left.desc;
                document.getElementById("door-side-r").textContent = s.right.desc;
                document.getElementById("door-desc-l").textContent = s.left.desc;
                document.getElementById("door-desc-r").textContent = s.right.desc;
                document.getElementById("door-screen-lyric").textContent = s.lyric;
                lyricEl.style.opacity = 0;
                doorScreen.classList.add("on");
            }

            function hideDoorScreen() {
                doorScreen.classList.remove("on");
            }

            function litPip(i) {
                document.getElementById(`p${i}`).classList.add("lit");
            }

            // ── Game flow ─────────────────────────────────────────────────────────────────

            function startGame() {
                const intro = document.getElementById("intro");
                intro.style.opacity = 0;
                fadeInAudio();
                setTimeout(() => {
                    intro.style.display = "none";
                    document.getElementById("pips").style.opacity = 1;
                    showLyric("DEINE ZEIT IST GEKOMMEN", 2600);
                    setTimeout(() => {
                        targetZ = DOOR_Z[0] + 3.8;
                        phase = "walk";
                    }, 700);
                }, 1600);
            }

            function chooseDoor(idx) {
                if (phase !== "choose") return;
                const s = STEPS[step];
                picked.push(idx === 0 ? s.left : s.right);
                sides.push(idx);
                litPip(step);
                hideDoorScreen();
                lyricEl.style.opacity = 0;

                step++;
                phase = "walk";

                if (step < 3) {
                    setTimeout(() => showLyric(s.lyric, 2400), 500);
                    targetZ = DOOR_Z[step] + 3.8;
                } else {
                    setTimeout(() => showLyric("DER MEISTER HAT DEN WEG"), 500);
                    targetZ = DOOR_Z[2] - SEG * 0.55;
                    phase = "final";
                    setTimeout(showReveal, 2600);
                }
            }

            function showReveal() {
                phase = "done";
                lyricEl.style.opacity = 0;
                const fadeToReveal = () => {
                    if (audio.volume < 0.07) {
                        audio.volume = Math.min(audio.volume + 0.002, 0.07);
                        setTimeout(fadeToReveal, 120);
                    }
                };
                fadeToReveal();

                const gutCount = sides.filter((s) => s === 0).length;
                const boeseCount = 3 - gutCount;
                const dominant = gutCount >= boeseCount ? "gut" : "boese";
                const pct = Math.round(
                    (Math.max(gutCount, boeseCount) / 3) * 100,
                );
                const label = dominant === "gut" ? "GUT" : "BÖSE";
                const pctEl = document.getElementById("pct-line");
                pctEl.textContent = `DU WÄHLTEST ${pct}% ${label}`;
                pctEl.classList.add(dominant);

                const pathEl = document.getElementById("path");
                picked.forEach((p, i) => {
                    const node = document.createElement("span");
                    node.className = "path-node";
                    node.textContent = p.name;
                    pathEl.appendChild(node);
                    if (i < 2) {
                        const sep = document.createElement("span");
                        sep.className = "path-sep";
                        sep.textContent = "→";
                        pathEl.appendChild(sep);
                    }
                });

                document.getElementById("reveal").classList.add("on");
            }

            window.share = function () {
                const path = picked.map((p) => p.name).join(" → ");
                const text = `Mein Weg: ${path}\n"Alle Wege führen zum Meister."\n\n#MisterMonopol #DerMeisterHatDenWeg`;
                const url = "https://music.monopol-ai.de/weg";

                if (navigator.share) {
                    navigator.share({ title: "DER MEISTER HAT DEN WEG", text, url }).catch(() => {});
                } else {
                    try {
                        navigator.clipboard.writeText(text + "\n" + url);
                        alert("In Zwischenablage kopiert!");
                    } catch (e) {
                        alert("Link: " + url);
                    }
                }
            };

            document.getElementById("intro").addEventListener("click", startGame);
            document.getElementById("door-left").addEventListener("click", () => chooseDoor(0));
            document.getElementById("door-right").addEventListener("click", () => chooseDoor(1));

            // ── Render loop ───────────────────────────────────────────────────────────────

            const clock = new THREE.Clock();

            (function loop() {
                requestAnimationFrame(loop);
                const dt = clock.getDelta();
                const t = clock.elapsedTime;

                if (phase === "walk" || phase === "final") {
                    const diff = targetZ - camZ;
                    camZ += diff * Math.min(dt * 1.9, 0.09);
                    if (phase === "walk" && Math.abs(diff) < 3.5) {
                        phase = "choose";
                        showDoorScreen();
                    }
                }

                const walking = phase === "walk" || phase === "final";
                camera.position.z = camZ;
                camera.position.y =
                    1.65 + Math.sin(t * 1.75) * (walking ? 0.024 : 0.007);
                camera.position.x = Math.sin(t * 0.87) * (walking ? 0.011 : 0);

                candleLights.forEach((l, i) => {
                    l.intensity =
                        0.9 +
                        Math.sin(t * 5.9 + i * 2.3) * 0.22 +
                        Math.sin(t * 13.1 + i * 0.7) * 0.09;
                });

                renderer.render(scene, camera);
            })();

            function onResize() {
                const vp = window.visualViewport;
                const w = vp ? vp.width  : innerWidth;
                const h = vp ? vp.height : innerHeight;
                const portrait = h > w;
                camera.fov = portrait ? 90 : 68;
                camera.aspect = w / h;
                camera.updateProjectionMatrix();
                renderer.setSize(w, h);
            }
            window.addEventListener("resize", onResize);
            if (window.visualViewport) window.visualViewport.addEventListener("resize", onResize);
            onResize();
        </script>
    </body>
